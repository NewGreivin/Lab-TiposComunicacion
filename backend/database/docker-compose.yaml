services:
  mysql:
    image: mysql:8.0
    container_name: mysql_smartnotifysolutions
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laboratorio_comunicacion
    ports:
      - "3307:3306"
    volumes:
      - mysql_smartnotifysolutions_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_smartnotifysolutions
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_smartnotifysolutions_data:

  # <- Para arrancar se usa "docker compose up -d", y para acceder se usa "http://localhost:8080"
  # El user y contraseña es "root". La DB usa el puerto 3307